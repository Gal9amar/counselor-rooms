[build]
  publish = "client/dist"
  command = "cd client && npm install && npm run build"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma"]
  included_files = ["prisma/**", "node_modules/.prisma/**"]

[[redirects]]
  from = "/api/rooms"
  to = "/.netlify/functions/rooms"
  status = 200

[[redirects]]
  from = "/api/rooms/*"
  to = "/.netlify/functions/rooms/:splat"
  status = 200

[[redirects]]
  from = "/api/therapists"
  to = "/.netlify/functions/therapists"
  status = 200

[[redirects]]
  from = "/api/therapists/*"
  to = "/.netlify/functions/therapists/:splat"
  status = 200

[[redirects]]
  from = "/api/schedule"
  to = "/.netlify/functions/schedule"
  status = 200

[[redirects]]
  from = "/api/schedule/*"
  to = "/.netlify/functions/schedule/:splat"
  status = 200

[[redirects]]
  from = "/api/recurring"
  to = "/.netlify/functions/recurring"
  status = 200

[[redirects]]
  from = "/api/recurring/*"
  to = "/.netlify/functions/recurring/:splat"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/room-notes"
  to = "/.netlify/functions/room-notes"
  status = 200

[[redirects]]
  from = "/api/room-notes/*"
  to = "/.netlify/functions/room-notes/:splat"
  status = 200

[[redirects]]
  from = "/api/booking-requests"
  to = "/.netlify/functions/booking-requests"
  status = 200

[[redirects]]
  from = "/api/booking-requests/*"
  to = "/.netlify/functions/booking-requests/:splat"
  status = 200

# Local dev (netlify dev proxies to Vite): let Vite serve its own module paths instead of the SPA fallback below.
[[redirects]]
  from = "/@vite/*"
  to = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/@react-refresh"
  to = "/@react-refresh"
  status = 200

[[redirects]]
  from = "/@id/*"
  to = "/@id/:splat"
  status = 200

[[redirects]]
  from = "/@fs/*"
  to = "/@fs/:splat"
  status = 200

[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200

[[redirects]]
  from = "/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev --prefix client"
  targetPort = 5173
  autoLaunch = false
